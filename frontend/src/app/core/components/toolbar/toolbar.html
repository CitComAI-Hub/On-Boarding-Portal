<mat-toolbar color="primary" class="main-header mat-elevation-z4">
    <div class="header-container">
        <div class="brand" (click)="goLanding()">
            <img src="/logo-citcom.png" [class.logo-white]="ui.theme() === 'dark'" width="170" height="40" alt="CitCom"
                onerror="this.src='/logo-citcom.png';" />
            <div class="brand-text">
                <strong>{{ ui.t('toolbar.portal') }}</strong>
                <span>{{ ui.t('toolbar.space') }}</span>
            </div>
        </div>

        <span class="spacer"></span>
        <div class="toolbar-actions">
            @if(showAdminLogin || showUserMenu) {
            @if(showAdminLogin) {
            <button mat-button class="nav-link admin-button" [attr.aria-label]="ui.t('toolbar.admin')"
                (click)="onAdminLogin()">
                <mat-icon>lock_open</mat-icon>
                <span class="admin-label">{{ ui.t('toolbar.admin') }}</span>
            </button>
            }
            @if(showUserMenu && user && ui.keycloakAdminUrl) {
            <button mat-button class="nav-link admin-button" [attr.aria-label]="ui.t('toolbar.keycloakAdmin')"
                (click)="openExternal(ui.keycloakAdminUrl)">
                <mat-icon>admin_panel_settings</mat-icon>
                <span class="admin-label">{{ ui.t('toolbar.keycloakAdmin') }}</span>
            </button>
            }
            @if(showUserMenu && user) {
            <button matButton="text" [matMenuTriggerFor]="menu">
                <mat-icon>person</mat-icon>
                {{ user.given_name }} {{ user.family_name }}
            </button>
            <mat-menu #menu="matMenu">
                <button mat-menu-item disabled>
                    <p>{{ user.preferred_username }}</p>
                </button>
                <button (click)="onLogout()" mat-menu-item>{{ ui.t('toolbar.logout') }}</button>
            </mat-menu>
            }
            }

            <button mat-button [matMenuTriggerFor]="languageMenu" class="lang-button">
                <img class="lang-flag" [src]="'/flags/' + ui.language() + '.svg'" alt="" aria-hidden="true" width="20" height="14" />
                <span class="lang-code">{{ ui.language().toUpperCase() }}</span>
            </button>

            <mat-menu #languageMenu="matMenu">
                <button mat-menu-item (click)="ui.setLanguage('en')">
                    <img class="lang-flag" src="/flags/en.svg" alt="" aria-hidden="true" width="20" height="14" />
                    {{ ui.t('toolbar.langEnglish') }}
                </button>
                <button mat-menu-item (click)="ui.setLanguage('es')">
                    <img class="lang-flag" src="/flags/es.svg" alt="" aria-hidden="true" width="20" height="14" />
                    {{ ui.t('toolbar.langSpanish') }}
                </button>
            </mat-menu>

            @if(ui.enableThemeToggle) {
            <button mat-icon-button type="button" [attr.aria-label]="ui.t('toolbar.theme')" (click)="ui.toggleTheme()">
                <mat-icon>{{ ui.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
            </button>
            }
        </div>
    </div>
</mat-toolbar>
